name: Daily Nihongo Update

on:
  schedule:
    # 20:19 UTC corresponds to 01:19 AM in Asia/Karachi (UTC+5)
    - cron: "19 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Git identity from Secrets
        env:
          GIT_USER_NAME: ${{ secrets.GIT_USER_NAME }}
          GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
        run: |
          git config --global user.name "$GIT_USER_NAME"
          git config --global user.email "$GIT_USER_EMAIL"
          echo "Configured Git user as: $GIT_USER_NAME <$GIT_USER_EMAIL>"

      # Determine target date in Asia/Karachi for commit messages
      - name: Compute today's date in Asia/Karachi
        id: karachi_date
        run: |
          TODAY_STR=$(python -c "from scripts.date_generator import get_current_date; print(get_current_date()['iso_date'])")
          echo "date=$TODAY_STR" >> $GITHUB_OUTPUT

      # Commit 1: Update CSV (data/dates.csv)
      - name: Step 1 - Update CSV
        run: |
          python scripts/main.py --step csv
          git add data/dates.csv
          if ! git diff --cached --quiet; then
            git commit -m "[Daily] Update dates.csv for ${{ steps.karachi_date.outputs.date }}"
          else
            echo "No changes in data/dates.csv"
          fi

      # Commit 2: Update JSON (data/today.json)
      - name: Step 2 - Update JSON
        run: |
          python scripts/main.py --step json
          git add data/today.json
          if ! git diff --cached --quiet; then
            git commit -m "[Daily] Update today.json for ${{ steps.karachi_date.outputs.date }}"
          else
            echo "No changes in data/today.json"
          fi

      # Commit 3: Update HTML (index.html)
      - name: Step 3 - Update HTML
        run: |
          python scripts/main.py --step html
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "[Daily] Update index.html for ${{ steps.karachi_date.outputs.date }}"
          else
            echo "No changes in index.html"
          fi

      # Commit 4: Generate Date SVG (assets/today-date.svg)
      - name: Step 4 - Generate Date SVG
        run: |
          python scripts/main.py --step date-svg
          git add assets/today-date.svg
          if ! git diff --cached --quiet; then
            git commit -m "[Daily] Generate today-date.svg for ${{ steps.karachi_date.outputs.date }}"
          else
            echo "No changes in assets/today-date.svg"
          fi

      # Commit 5: Generate Kanji SVG & README (assets/daily-kanji.svg & README.md)
      - name: Step 5 - Generate Kanji SVG & README
        run: |
          python scripts/main.py --step kanji-svg
          git add assets/daily-kanji.svg README.md
          if ! git diff --cached --quiet; then
            git commit -m "[Daily] Update daily-kanji.svg and README for ${{ steps.karachi_date.outputs.date }}"
          else
            echo "No changes in daily-kanji.svg or README.md"
          fi

      # Push all commits made during the run
      - name: Push commits
        run: |
          git push origin main
